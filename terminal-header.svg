<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="roundedClip">
      <rect x="1" y="1" width="898" height="248" rx="14" ry="14"/>
    </clipPath>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#roundedClip)">
    <rect x="1" y="1" width="898" height="248" fill="#130f28"/>
    <rect x="1" y="1" width="898" height="38" fill="#1e1b4b"/>
    <circle cx="26" cy="20" r="6" fill="#4f46e5"/>
    <circle cx="46" cy="20" r="6" fill="#7c3aed"/>
    <circle cx="66" cy="20" r="6" fill="#a78bfa"/>
    <text x="450" y="25" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#8b81c9">joaquin@github: ~</text>

    <text x="30" y="76" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#a78bfa">guest@github:~$ whoami</text>
    <text x="30" y="102" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#e9e5ff">&gt; joaquin_mancilla</text>

    <text x="30" y="140" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#a78bfa">guest@github:~$ cat role.txt</text>
    <text x="30" y="166" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#e9e5ff">&gt; Full Stack Developer &#183; AI Developer</text>

    <text x="30" y="204" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#a78bfa">guest@github:~$ ./status.sh --now</text>
    <text x="30" y="230" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#e9e5ff">&gt; desplegando agentes LLM desde 2026-01</text>
    <rect x="418" y="216" width="9" height="17" fill="#a78bfa">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.99;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="898" height="248" fill="none" stroke="url(#borderGrad)" stroke-opacity="0.5" stroke-width="1.5" rx="14" ry="14"/>
</svg>
